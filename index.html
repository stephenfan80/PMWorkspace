<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>product_agent</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f6f8fb; color: #172033; }
      main { max-width: 920px; margin: 0 auto; padding: 72px 24px; }
      h1 { font-size: clamp(42px, 8vw, 84px); line-height: 1; margin: 0 0 24px; }
      p { font-size: 20px; line-height: 1.7; max-width: 760px; }
      .pill { display: inline-block; padding: 8px 12px; border: 1px solid #b8c3d6; border-radius: 999px; color: #42526b; margin-bottom: 24px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-top: 40px; }
      .card { background: #fff; border: 1px solid #dfe5ef; border-radius: 8px; padding: 20px; }
      .card b { display: block; margin-bottom: 8px; }
      code { background: #e9eef7; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="pill">Product capability skills for agents</span>
      <h1>product_agent</h1>
      <p>把产品想法、截图、PRD 和行业经验转成可讨论、可验证、可出原型、可交付的产品资产。</p>
      <p>核心链路：<code>对齐 -> 原型 -> 复审 -> 交付</code></p>
      <section class="grid">
        <div class="card"><b>对齐</b>确认真实问题、目标用户、当前替代、主目标和反指标。</div>
        <div class="card"><b>原型</b>基于已对齐 brief 生成移动端优先、多方案、单图绑定的原型方向。</div>
        <div class="card"><b>复审</b>检查原型是否忠实表达产品判断和不可虚构边界。</div>
        <div class="card"><b>交付</b>整理产品设计文档、精简 PRD、实验和研发交付材料。</div>
      </section>
    </main>
  </body>
</html>
